[project]
name = "lrtools"
dynamic = ["version"]
description = "Retrieve photo data from Adobe Lightroom catalog"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "fedor denivac", email = "fdenivac@gmail.com" }]
keywords = ["lightroom", "sql", "photo"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "requests>=2.32.4",
    "tzlocal>=5.0.1",
]

[project.scripts]
lrselect = "lrselect:run"
lrsmart = "lrsmart:run"

[project.urls]
Homepage = "https://github.com/fdenivac/Lightroom-SQL-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "lrtools/_version.py"

[tool.hatch.build.targets.wheel]
only-include = ["lrtools", "lrselect.py", "lrsmart.py"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.3",
    "types-python-dateutil>=2.9.0.20261104",
    "types-pytz>=2026.6.0.20261031",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["bin", "plugins", "openspec", "Lightroom Famille BL-v13-4"]

[tool.ruff.lint]
# Every rule ruff has, minus the few listed below with their reason.
select = ["ALL"]
ignore = [
    "E501",    # line length is the formatter's job; SQL templates and help strings stay whole
    "COM812",  # conflicts with ruff format
    "CPY001",  # licence is in LICENSE, not in a per-file header
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# The library is an SQL builder over a read-only catalog: queries are assembled
# from internal tables, user values go through bound parameters or converters.
"lrtools/**" = ["S608"]
# Smart-collection criteria are dispatched by Lightroom's camelCase criterion name.
"lrtools/lrsmartcoll.py" = ["N802"]
# The CLI scripts and the result formatter write to stdout by design.
"{lrselect,lrsmart}.py" = ["T201"]
"lrtools/display.py" = ["T201"]
"tests/**" = [
    "S101",     # pytest asserts
    "PLR2004",  # expected values are literals
    "INP001",   # tests/ is not a package
    "S603",     # test_cli runs the scripts as subprocesses
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
extra_checks = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
files = ["lrtools", "lrselect.py", "lrsmart.py", "tests"]

[[tool.mypy.overrides]]
module = ["geopy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=lrtools --cov-report=term-missing"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
