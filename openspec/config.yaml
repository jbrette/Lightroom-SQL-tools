schema: spec-driven

context: |
  lrtools: a Python library plus two CLIs (lrselect, lrsmart) that query an
  Adobe Lightroom Classic catalog (.lrcat, SQLite) directly, read-only.
  Tech stack: Python >=3.14, uv, hatchling; stdlib sqlite3; geopy for geocoding.
  Quality gates: ruff (select = ALL), ruff format, mypy --strict, pytest on a
  synthetic catalog built from tests/data/schema.sql (real Lightroom Classic 13
  schema). Every function is type-annotated; the package ships py.typed.
  Fork of fdenivac/Lightroom-SQL-tools; origin is jbrette/Lightroom-SQL-tools.
  The catalog is never written to; that is a hard constraint for every change.

